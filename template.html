<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IB Math AA HL Question Bank</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f5f5f7;--surf:#fff;--ink:#1d1d1f;--ink2:#6e6e73;--ink3:#a1a1a6;--line:rgba(0,0,0,.08);--fill:rgba(120,120,128,.12);--acc:#0071e3;--glass:rgba(245,245,247,.78);--sh:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(0,0,0,.06);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--surf:#1c1c1e;--ink:#f5f5f7;--ink2:#98989d;--ink3:#636366;--line:rgba(255,255,255,.1);--fill:rgba(120,120,128,.24);--acc:#0a84ff;--glass:rgba(0,0,0,.7);--sh:0 10px 30px rgba(0,0,0,.5);color-scheme:dark}#sheet .bar{background:rgba(44,44,46,.72)}#sheet .bar button:hover,#sheet .seg{background:rgba(255,255,255,.1)}}
:root[data-theme="dark"]{--bg:#000;--surf:#1c1c1e;--ink:#f5f5f7;--ink2:#98989d;--ink3:#636366;--line:rgba(255,255,255,.1);--fill:rgba(120,120,128,.24);--acc:#0a84ff;--glass:rgba(0,0,0,.7);--sh:0 10px 30px rgba(0,0,0,.5);color-scheme:dark}
:root[data-theme="dark"] #sheet .bar{background:rgba(44,44,46,.72)}
:root[data-theme="dark"] #sheet .bar button:hover,:root[data-theme="dark"] #sheet .seg{background:rgba(255,255,255,.1)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.011em}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-columns:300px minmax(0,1fr);height:100%}
aside{border-right:1px solid var(--line);overflow-y:auto;padding:28px 20px 40px;background:var(--surf)}
h1{font-size:21px;font-weight:700;letter-spacing:-.025em;line-height:1.2}
.sub{color:var(--ink2);font-size:13px;margin:2px 0 22px}
.browse{position:relative;display:inline-flex;align-items:center;gap:4px;margin:2px 0 22px;color:var(--ink2);font-size:15px;font-weight:500;line-height:1.3}
.browse select{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;border-radius:0;background:none;opacity:0;cursor:pointer;appearance:none;-webkit-appearance:none}
.browse::after{content:"";width:11px;height:11px;background:currentColor;flex:none;-webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path fill='black' d='M2.2 4.2 6 8l3.8-3.8-1-1L6 6 3.2 3.2z'/></svg>") center/contain no-repeat;mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path fill='black' d='M2.2 4.2 6 8l3.8-3.8-1-1L6 6 3.2 3.2z'/></svg>") center/contain no-repeat}
.grp{margin-bottom:22px}
.grp h3{font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:8px;display:flex;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 11px;border-radius:999px;background:var(--fill);font-size:13px;font-weight:500;transition:background .15s,color .15s}
.chip small{color:var(--ink3);font-size:11px;margin-left:5px;font-weight:500}
.chip:hover{background:rgba(120,120,128,.2)}
.chip.on{background:var(--acc);color:#fff}.chip.on small{color:rgba(255,255,255,.75)}
.chip.z{opacity:.4}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{padding:5px 0;border-radius:7px;font-size:13px;font-weight:500;color:var(--ink2)}
.seg button.on{background:var(--surf);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.seg button.z{opacity:.4}
.area{border-radius:10px}
.arow{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:9px;width:100%;text-align:left;font-weight:500}
.arow:hover,.trow:hover{background:var(--fill)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 0 3px transparent;transition:box-shadow .15s}
.arow.on .dot,.trow.on .dot{box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 28%,transparent)}
.arow.on{background:color-mix(in srgb,var(--c) 14%,transparent)}
.arow span.n,.trow span.n{margin-left:auto;color:var(--ink3);font-size:12px}
.chev{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:var(--ink3);flex:none;transition:transform .2s}
.chev.open{transform:rotate(90deg)}
.arow-w{display:flex;align-items:center}
.trows{padding:2px 0 6px 18px}
.trow{display:flex;gap:9px;align-items:center;padding:5px 8px;border-radius:8px;width:100%;text-align:left;font-size:13.5px;color:var(--ink2)}
.trow b{font-weight:500;color:var(--ink3);font-size:12px;width:28px;flex:none}
.trow.on{background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--ink)}
.trow.z{opacity:.35}
.dot.sm{width:6px;height:6px}
main{overflow-y:auto;position:relative}
.top{position:sticky;top:0;z-index:5;background:var(--glass);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);border-bottom:1px solid var(--line);padding:14px 28px}
.bar{display:flex;gap:10px;align-items:center;min-width:0}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:11px;padding:0 12px;height:38px}
.search svg{flex:none;color:var(--ink3)}
.search input{flex:1;border:0;background:none;outline:0;height:100%;min-width:0}
.search kbd{font:500 11px/1 inherit;color:var(--ink3);border:1px solid var(--line);border-radius:5px;padding:3px 6px}
select{background:var(--fill);border:0;border-radius:11px;height:38px;padding:0 12px;outline-offset:2px}
.fbtn{display:none;height:38px;padding:0 14px;border-radius:11px;background:var(--fill);font-weight:500;position:relative}
.fbtn svg,.sortbtn svg{display:block;width:20px;height:20px;min-width:20px;min-height:20px;aspect-ratio:1;flex:none;color:color-mix(in srgb,var(--ink) 80%,#fff)}
.sortbtn{display:flex;align-items:center;flex:none}
.sortbtn svg{display:none}
.meta{position:relative;display:flex;align-items:center;gap:8px;flex-wrap:nowrap;margin-top:10px;min-height:26px;min-width:0}
.count{font-size:13px;color:var(--ink2);margin-right:4px;flex:none;white-space:nowrap;min-width:0}
.pillwrap{min-width:0;flex:1;display:flex}
.pills{display:flex;align-items:center;gap:8px;min-width:0;flex:1;overflow:hidden}
.pill{display:inline-flex;gap:6px;align-items:center;padding:3px 6px 3px 10px;border-radius:999px;background:color-mix(in srgb,var(--acc) 13%,transparent);color:var(--acc);font-size:12.5px;font-weight:500;flex:none}
.pill i{font-style:normal;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 20%,transparent);font-size:11px;line-height:1}
.pill.more{background:none;color:var(--ink2);font-weight:600;padding:3px 4px}
.pmenu{position:absolute;top:calc(100% + 8px);left:0;z-index:8;display:flex;flex-wrap:wrap;gap:6px;width:max-content;max-width:100%;padding:10px;background:var(--surf);border-radius:14px;box-shadow:var(--sh),0 0 0 1px var(--line)}
.pmenu[hidden]{display:none}
.clear{font-size:12.5px;color:var(--acc);font-weight:500;padding:3px 6px;flex:none;white-space:nowrap}
.toggles{display:flex;gap:6px;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(310px,100%),1fr));gap:16px;padding:22px 28px 60px;min-width:0}
.card{background:var(--surf);border-radius:18px;padding:16px 18px 14px;text-align:left;display:flex;flex-direction:column;gap:10px;box-shadow:0 0 0 1px var(--line);transition:transform .18s,box-shadow .18s;min-height:230px;min-width:0;overflow:hidden}
.card:hover{transform:translateY(-2px);box-shadow:0 0 0 1px var(--line),var(--sh)}
.ch{display:flex;align-items:baseline;gap:8px;min-width:0}
.qn{font-weight:700;font-size:17px;letter-spacing:-.02em;flex:none}
.src{color:var(--ink2);font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mk{margin-left:auto;font-size:12px;font-weight:600;color:var(--ink2);background:var(--fill);padding:2px 8px;border-radius:999px;white-space:nowrap}
.prev{position:relative;max-height:150px;overflow:hidden;font-size:14px;color:var(--ink);-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent);flex:1;min-width:0;pointer-events:none}
.tags{display:flex;gap:5px;flex-wrap:wrap;align-items:center;min-width:0;flex:1}
.tag{font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;color:color-mix(in srgb,var(--c) 72%,var(--ink));background:color-mix(in srgb,var(--c) 14%,transparent);white-space:nowrap}
.tag.more{color:var(--ink3);background:none;padding:2px 2px}
.star{margin-left:auto;color:var(--ink3);font-size:16px;line-height:1;padding:2px}
.star.on{color:#ff9f0a}
.foot{display:flex;align-items:center;gap:6px;min-width:0}
.q p{margin:0 0 .8em}
.q .pt{display:flex;gap:10px;align-items:flex-start;margin-left:2px}.q .pt b{font-weight:600;color:var(--ink2);flex:none;min-width:24px}.q .pt span:not(.pts){flex:1}
.q p.ln{display:flex;align-items:flex-start;gap:12px}
.q .pts{width:26px;height:26px;min-width:26px;min-height:26px;aspect-ratio:1;margin-left:auto;align-self:flex-start;border-radius:50%;background:var(--fill);color:var(--ink);display:inline-grid;place-items:center;font-size:12.5px;font-weight:650;letter-spacing:-.02em;line-height:1;flex:0 0 26px}
.q .pm{display:flex;justify-content:flex-end;margin:-.15em 0 .85em}
.q .tw{overflow-x:auto;margin:.4em 0 .9em}
.q table{border-collapse:collapse;font-size:.93em}
.q td,.q th{border:1px solid var(--line);padding:4px 10px;text-align:center}
.q th{background:var(--fill);font-weight:600}
.q img.fig{display:block;max-width:min(100%,440px);height:auto;margin:.5em auto .9em;background:#fff;border-radius:10px;padding:8px}
.prev img.fig{max-height:110px;width:auto;margin:.3em auto;padding:4px}
.q mjx-container{max-width:100%;overflow-x:auto;overflow-y:hidden}
.q mjx-container[display="true"]{margin:.7em 0!important}
.empty{grid-column:1/-1;text-align:center;padding:90px 20px;color:var(--ink2)}
.empty b{display:block;font-size:19px;color:var(--ink);margin-bottom:4px}
.empty button{margin-top:14px;color:#fff;background:var(--acc);padding:8px 18px;border-radius:999px;font-weight:500}
.grid.list{display:flex;flex-direction:column}
.prow{display:flex;align-items:center;gap:10px;width:100%;background:var(--surf);border-radius:14px;padding:13px 16px;box-shadow:0 0 0 1px var(--line);text-align:left}
.prow:hover{box-shadow:0 0 0 1px var(--line),var(--sh)}
.prow .src{color:var(--ink2);font-size:14px;min-width:0}
.prow .mk{margin-left:auto}
#sheet.docs .qonly{display:none}
#sheet.docs .sb{padding:0;overflow:hidden}
#sheet.docs .pframe{display:block;width:100%;height:100%;border:0;background:#3a3a3c}
#sheet.docs .bar .count{display:block;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;padding:0 8px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.32);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(780px,100%);background:var(--surf);z-index:21;transform:translateX(104%);transition:transform .38s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.18);padding-top:env(safe-area-inset-top,0px);overflow:hidden}
.sheet.on{transform:none}
.paper{background:#fff;border-radius:14px;overflow:hidden;color-scheme:light}
.paper img{width:100%;height:auto;display:block}
#sheet .qfoot{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;pointer-events:none}
#sheet .bar{position:static;left:auto;bottom:auto;transform:none;pointer-events:auto;display:flex;align-items:center;justify-content:center;gap:4px;width:100%;max-width:none;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));border-radius:0;border-top:1px solid var(--line);background:rgba(255,255,255,.72);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);min-width:0}
#sheet .bar button{appearance:none;border:0;background:transparent;color:var(--ink);width:44px;height:44px;min-width:44px;aspect-ratio:1;flex:none;border-radius:50%;display:grid;place-items:center;cursor:pointer;transition:background .2s,transform .15s,color .2s}
#sheet .bar button:hover{background:rgba(0,0,0,.06)}
#sheet .bar button:active{transform:scale(.92)}
#sheet .bar button:disabled{opacity:.3;pointer-events:none}
#sheet .bar svg{display:block;width:22px;height:22px;min-width:22px;min-height:22px;aspect-ratio:1;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#sheet .sep{width:1px;height:24px;background:var(--line);margin:0 4px;flex:none}
#sheet .seg{display:flex;flex:none;background:rgba(0,0,0,.06);border-radius:99px;padding:3px;gap:2px}
#sheet .bar .seg button{width:auto;min-width:76px;height:36px;aspect-ratio:auto;flex:none;padding:0 18px;border-radius:99px;font:600 14px/1 inherit;color:var(--ink2);box-shadow:none}
#sheet .bar .seg button.on{background:var(--surf);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
#sheet .bar .seg svg{display:none}
#sheet #bm.on{color:#ff9f0a}#sheet #bm.on svg{fill:#ff9f0a}
#sheet #cp.done{color:var(--acc)}
#sheet .bar .count{font-size:13px;color:var(--ink2);min-width:44px;margin:0;text-align:center;font-variant-numeric:tabular-nums}
.sb{overflow-y:auto;padding:26px 32px 108px;flex:1;min-width:0;touch-action:pan-y;overscroll-behavior-x:contain}
.sb.swiping{overflow:hidden;padding:0}
.sb .reel{display:flex;height:100%}
.sb .pane{flex:none;height:100%;overflow-x:hidden;overflow-y:auto;box-sizing:border-box}
.sb .q{font-size:17px;line-height:1.65;max-width:68ch;overflow-wrap:break-word}
.facts{display:flex;flex-wrap:wrap;gap:8px 22px;margin:0 0 20px;color:var(--ink2);font-size:13px}
.facts b{color:var(--ink);font-weight:600}
.note{margin-top:26px;padding:12px 14px;border-radius:12px;background:var(--fill);color:var(--ink2);font-size:13px}
.acts{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
.btn{padding:8px 16px;border-radius:999px;background:var(--fill);font-weight:500;font-size:14px}
.btn.p{background:var(--acc);color:#fff}
.sk{background:var(--c)}
.dr{display:none}
@media (max-width:860px){
 .app{grid-template-columns:minmax(0,1fr)}
 aside{position:fixed;inset:0 0 0 auto;width:min(340px,92%);z-index:22;transform:translateX(104%);transition:transform .35s cubic-bezier(.32,.72,0,1);padding-top:calc(24px + env(safe-area-inset-top,0px))}
 aside.on{transform:none}
 .fbtn{display:grid;place-items:center;width:38px;height:38px;padding:0}
 .fbtn svg{grid-area:1/1}
 .fbtn .flab{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
 .fbtn #fbadge{position:absolute;top:-4px;right:-4px}
 .fbtn #fbadge:empty{display:none}
 .fbtn #fbadge:not(:empty){min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--acc);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
 .sortbtn{position:relative;width:38px;height:38px;display:grid;place-items:center;overflow:hidden}
 .sortbtn svg{display:block}
 .sortbtn select{position:absolute;inset:0;width:100%;height:100%;min-width:0;max-width:100%;opacity:0}
 .search kbd{display:none}
 .top{padding:12px 16px}.grid{padding:16px;grid-template-columns:minmax(0,1fr)}
 .sb{padding:20px 16px 108px}.dr{display:grid;margin-left:auto}
 .toggles{margin-left:0}
 #sheet .bar .seg button{min-width:58px;padding:0 10px}
 #sheet .sep{margin:0 2px}
 #sheet .bar button{width:40px;height:40px;min-width:40px}
 #sheet .bar .count{display:none}
}
@media (max-width:430px){
 #sheet .bar .seg button span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
 #sheet .bar .seg svg{display:block;width:20px;height:20px;min-width:20px;min-height:20px}
 #sheet .bar .seg button{width:36px;height:36px;min-width:36px;padding:0;aspect-ratio:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
 <aside id="side" aria-label="Filters"></aside>
 <main id="main">
  <div class="top">
   <div class="bar">
    <button class="fbtn" id="fopen" aria-label="Filters"><i data-lucide="arrow-down-wide-narrow" width="20" height="20" aria-hidden="true"></i><span class="flab">Filters</span><span id="fbadge"></span></button>
    <label class="search"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="7" cy="7" r="5"/><path d="m11 11 3.5 3.5"/></svg><input id="q" type="search" placeholder="Search questions, topics, papers" autocomplete="off" aria-label="Search"><kbd>/</kbd></label>
    <label class="sortbtn"><i data-lucide="arrow-up-down" width="20" height="20" aria-hidden="true"></i><select id="sort" aria-label="Sort"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="mh">Most marks</option><option value="ml">Fewest marks</option><option value="tp">By topic</option></select></label>
   </div>
   <div class="meta" id="meta"></div>
  </div>
  <div class="grid" id="grid"></div>
  <div id="sent" style="height:1px"></div>
 </main>
</div>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" aria-hidden="true" role="dialog" aria-label="Question">
 <div class="sb" id="sbody"></div>
 <div class="qfoot">
 <nav class="bar" aria-label="Question controls">
  <button id="close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <span class="sep"></span>
  <button id="prev" aria-label="Previous question"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <span class="count" id="count"></span>
  <button id="next" aria-label="Next question"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  <span class="sep qonly"></span>
  <div class="seg qonly" role="tablist">
    <button id="tText" class="on" role="tab" aria-label="Text"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h9"/></svg><span>Text</span></button>
    <button id="tPaper" role="tab" aria-label="Paper"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.4"/><path d="M20 16l-4.5-4-7.5 6"/></svg><span>Paper</span></button>
    <button id="tScheme" role="tab" aria-label="Markscheme"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span>Scheme</span></button>
  </div>
  <span class="sep qonly"></span>
  <button id="bm" class="qonly" aria-label="Bookmark" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4-6 4z"/></svg></button>
  <button id="cp" class="qonly" aria-label="Copy question text"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button>
 </nav>
 </div>
</section>

<script>
const D=__DATA__;
const AREAS={"Number and algebra":"#0a84ff","Functions":"#bf5af2","Geometry and trigonometry":"#ff9f0a","Statistics and probability":"#30d158","Calculus":"#ff375f"};
const AREA_SHORT={"Number and algebra":"Number & algebra","Geometry and trigonometry":"Geometry & trig","Statistics and probability":"Stats & probability"};
const T=D.topics,Q=D.qs;
const PAPERS=(()=>{const m=new Map();for(const q of Q){const i=q.i.replace(/-q\d+$/,'');let p=m.get(i);if(!p){p={i,y:q.y,s:q.s,p:q.p,z:q.z||'',n:0};m.set(i,p)}p.n++}return [...m.values()]})();
const WHEN={May:0,November:1,Specimen:2};
let mode='questions',PR=[],docs=false;
const MB=[['1–5',m=>m<=5],['6–9',m=>m>=6&&m<=9],['10–14',m=>m>=10&&m<=14],['15+',m=>m>=15]];
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const lab=q=>(q.s==='Specimen'?'Specimen ':q.s+' ')+q.y;
const calc=q=>q.p===1?'No calculator':'Calculator allowed';
let ST={};try{ST=JSON.parse(localStorage.getItem('ibq-star')||'{}')}catch(e){}
let view='text';
const saveST=()=>{try{localStorage.setItem('ibq-star',JSON.stringify(ST))}catch(e){}};
const S={p:new Set(),y:new Set(),s:new Set(),m:new Set(),a:new Set(),t:new Set(),saved:false,ver:false,txt:''};
const open=new Set();let R=[],shown=30,cur=-1;
Q.forEach(q=>{q.ar=[...new Set(q.c.map(c=>T[c][1]))];q.h=(q.t+' '+lab(q)+' paper '+q.p+' '+(q.z||'')+' q'+q.n+' '+q.c.map(c=>c+' '+T[c][0]).join(' ')).toLowerCase()});
function ok(q,skip){
 if(skip!=='p'&&S.p.size&&!S.p.has(q.p))return false;
 if(skip!=='y'&&S.y.size&&!S.y.has(q.y))return false;
 if(skip!=='s'&&S.s.size&&!S.s.has(q.s))return false;
 if(skip!=='m'&&S.m.size&&!(q.m!=null&&[...S.m].some(i=>MB[i][1](q.m))))return false;
 if(skip!=='t'&&(S.t.size||S.a.size)&&!(q.c.some(c=>S.t.has(c))||q.ar.some(a=>S.a.has(a))))return false;
 if(S.saved&&!ST[q.i])return false;
 if(S.ver&&!q.v)return false;
 if(S.txt){for(const w of S.txt.split(/\s+/))if(w&&!q.h.includes(w))return false}
 return true}
function tally(g,fn){const c={};Q.forEach(q=>{if(ok(q,g))fn(q).forEach(k=>c[k]=(c[k]||0)+1)});return c}
function fmt(t,lim){
 const M=[],TB=[];
 t=t.replace(/\$\$[\s\S]+?\$\$|\\\[[\s\S]+?\\\]|\\\([\s\S]+?\\\)|\$[^$\n]+?\$/g,m=>(M.push(m),'\u0001'+(M.length-1)+'\u0002'));
 t=t.replace(/<table[\s\S]*?<\/table>/gi,m=>{m=m.replace(/<(?!\/?(table|thead|tbody|tr|td|th)\b)[^>]*>/gi,'').replace(/<(td|th)\b([^>]*)>/gi,(x,g,a)=>{const k=(a.match(/(colspan|rowspan)="?\d+"?/gi)||[]).join(' ');return '<'+g+(k?' '+k:'')+'>'}).replace(/<table[^>]*>/i,'<table>');TB.push(m);return '\u0003'+(TB.length-1)+'\u0004'});
 t=t.replace(/<\/?div[^>]*>/gi,'').replace(/^#+\s*/gm,'');
 const pipe=l=>/^\s*\|.+\|/.test(l);
 const sep=l=>pipe(l)&&l.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').every(c=>/^\s*:?-{3,}:?\s*$/.test(c));
 const cells=l=>l.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>esc(c.trim()));
 const src=t.split('\n'),kept=[];
 for(let i=0;i<src.length;){
  let j=i+1;while(j<src.length&&!src[j].trim())j++;
  if(pipe(src[i])&&j<src.length&&sep(src[j])){
   const rows=[src[i]];i=j+1;
   while(i<src.length){
    if(!src[i].trim()){let k=i+1;while(k<src.length&&!src[k].trim())k++;if(k<src.length&&pipe(src[k])&&!sep(src[k])){i=k;continue}break}
    if(pipe(src[i])&&!sep(src[i])){rows.push(src[i++]);continue}
    break}
   TB.push('<table><thead><tr>'+cells(rows[0]).map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(1).map(r=>'<tr>'+cells(r).map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table>');
   kept.push('\u0003'+(TB.length-1)+'\u0004');
  }else kept.push(src[i++]);
 }
 t=kept.join('\n');
 const back=s=>s.replace(/\u0001(\d+)\u0002/g,(x,i)=>esc(M[i]));
 let out='',n=0;
 for(let l of t.split('\n')){l=l.trim();if(!l)continue;
  let h,r;
  if(r=l.match(/^!\[\]\((\/fig\/[a-z0-9-]+\.png)\)$/))h='<img class="fig" alt="Diagram" src="'+r[1]+'">';
  else if(r=l.match(/^\u0003(\d+)\u0004$/))h='<div class="tw">'+TB[r[1]].replace(/\u0001(\d+)\u0002/g,(x,i)=>esc(M[i]))+'</div>';
  else if(r=l.match(/^\[(\d+)\]$/))h='<div class="pm"><span class="pts" title="'+r[1]+(r[1]==='1'?' mark':' marks')+'">'+r[1]+'</span></div>';
  else{const mk=l.match(/\s*\[(\d+)\]$/),mv=mk&&!/maximum mark/i.test(l)?mk[1]:'';if(mv)l=l.slice(0,mk.index).trimEnd();l=esc(l);const b=mv?'<span class="pts" title="'+mv+(mv==='1'?' mark':' marks')+'">'+mv+'</span>':'';
   h=(r=l.match(/^(\((?:[a-h]|i{1,3}|iv|vi{0,3}|ix|x)\))\s+([\s\S]*)$/))?'<p class="pt"><b>'+r[1]+'</b><span>'+back(r[2])+'</span>'+b+'</p>':'<p'+(b?' class="ln"':'')+'>'+back(l)+b+'</p>'}
  out+=h;n+=l.length;if(lim&&n>lim)break}
 return out}
function tags(q,max){const c=q.c;let h=c.slice(0,max).map(k=>'<span class="tag" style="--c:'+AREAS[T[k][1]]+'">'+T[k][0]+'</span>').join('');if(c.length>max)h+='<span class="tag more">+'+(c.length-max)+'</span>';return h}
function card(q,i){return '<article class="card" tabindex="0" role="button" data-i="'+i+'"><div class="ch"><span class="qn">Q'+q.n+'</span><span class="src">'+lab(q)+', Paper '+q.p+(q.z?', '+q.z:'')+'</span>'+(q.m?'<span class="mk">'+q.m+' marks</span>':'')+'</div><div class="prev q">'+fmt(q.t,420)+'</div><div class="foot"><div class="tags">'+tags(q,2)+'</div><span class="star'+(ST[q.i]?' on':'')+'" data-s="'+i+'" role="button" aria-label="Save question">'+(ST[q.i]?'★':'☆')+'</span></div></article>'}
let pend=[];
function typeset(els){if(!window.mjReady){pend.push(...els);return}window.mjq=(window.mjq||Promise.resolve()).then(()=>MathJax.typesetPromise(els)).catch(()=>{})}
function flush(){const p=pend;pend=[];if(p.length)typeset(p)}
function sortR(){const k=$('#sort').value,f={new:(a,b)=>0,old:(a,b)=>Q.indexOf(b)-Q.indexOf(a),mh:(a,b)=>(b.m||0)-(a.m||0),ml:(a,b)=>(a.m??99)-(b.m??99),tp:(a,b)=>(a.c[0]||'').localeCompare(b.c[0]||'',undefined,{numeric:true})};R.sort(f[k])}
function paperHay(p){return (p.s+' '+p.y+' paper '+p.p+' '+(p.z||'')).toLowerCase()}
function okPaper(p,skip){
 if(skip!=='p'&&S.p.size&&!S.p.has(p.p))return false;
 if(skip!=='y'&&S.y.size&&!S.y.has(p.y))return false;
 if(skip!=='s'&&S.s.size&&!S.s.has(p.s))return false;
 if(S.txt){for(const w of S.txt.split(/\s+/))if(w&&!paperHay(p).includes(w))return false}
 return true}
function tallyP(g,fn){const c={};PAPERS.forEach(p=>{if(okPaper(p,g))fn(p).forEach(k=>c[k]=(c[k]||0)+1)});return c}
function sortP(){const old=$('#sort').value==='old';PR.sort((a,b)=>{const d=(a.y-b.y)||((WHEN[a.s]??9)-(WHEN[b.s]??9));return (d?(old?d:-d):0)||a.p-b.p||(a.z||'').localeCompare(b.z||'')})}
function paperName(p){return p.s+' '+p.y+', Paper '+p.p+(p.z?', '+p.z:'')}
function head(){const on=mode==='papers',ql='Questions, '+Q.length,pl='Whole papers, '+PAPERS.length;return '<h1>IB Math AA HL</h1><label class="browse"><span>'+(on?pl:ql)+'</span><select id="browse" aria-label="Browse"><option value="questions"'+(on?'':' selected')+'>'+ql+'</option><option value="papers"'+(on?' selected':'')+'>'+pl+'</option></select></label>'}
function sidePapers(){
 const cp=tallyP('p',p=>[p.p]),cy=tallyP('y',p=>[p.y]),cs=tallyP('s',p=>[p.s]);
 const years=[...new Set(PAPERS.map(p=>p.y))].sort((a,b)=>b-a);
 let h=head();
 h+='<div class="grp"><h3>Paper</h3><div class="seg">'+[1,2,3].map(p=>'<button data-g="p" data-v="'+p+'" class="'+(S.p.has(p)?'on':'')+((cp[p]||0)===0&&!S.p.has(p)?' z':'')+'">Paper '+p+'</button>').join('')+'</div></div>';
 h+='<div class="grp"><h3>Year</h3><div class="chips">'+chips('y',years,cy)+'</div></div>';
 h+='<div class="grp"><h3>Session</h3><div class="chips">'+chips('s',['May','November','Specimen'],cs)+'</div></div>';
 $('#side').innerHTML=h}
function chips(g,vals,cnt,lab2){return vals.map(v=>'<button class="chip'+(S[g].has(v)?' on':'')+((cnt[v]||0)===0&&!S[g].has(v)?' z':'')+'" data-g="'+g+'" data-v="'+v+'">'+(lab2?lab2(v):v)+'<small>'+(cnt[v]||0)+'</small></button>').join('')}
function side(){
 if(mode==='papers'){sidePapers();return}
 const cp=tally('p',q=>[q.p]),cy=tally('y',q=>[q.y]),cs=tally('s',q=>[q.s]),cm=tally('m',q=>q.m==null?[]:MB.map((b,i)=>b[1](q.m)?i:-1).filter(i=>i>=0)),ct=tally('t',q=>q.c),ca=tally('t',q=>q.ar);
 const years=[...new Set(Q.map(q=>q.y))].sort((a,b)=>b-a);
 let h=head();
 h+='<div class="grp"><h3>Paper</h3><div class="seg">'+[1,2,3].map(p=>'<button data-g="p" data-v="'+p+'" class="'+(S.p.has(p)?'on':'')+((cp[p]||0)===0&&!S.p.has(p)?' z':'')+'">Paper '+p+'</button>').join('')+'</div></div>';
 h+='<div class="grp"><h3>Year</h3><div class="chips">'+chips('y',years,cy)+'</div></div>';
 h+='<div class="grp"><h3>Session</h3><div class="chips">'+chips('s',['May','November','Specimen'],cs)+'</div></div>';
 h+='<div class="grp"><h3>Marks</h3><div class="seg">'+MB.map((b,i)=>'<button data-g="m" data-v="'+i+'" class="'+(S.m.has(i)?'on':'')+((cm[i]||0)===0&&!S.m.has(i)?' z':'')+'">'+b[0]+'</button>').join('')+'</div></div>';
 h+='<div class="grp"><h3>Topic</h3>';
 for(const A in AREAS){const codes=Object.keys(T).filter(c=>T[c][1]===A).sort((a,b)=>parseFloat(a.split('.')[1])-parseFloat(b.split('.')[1]));
  h+='<div class="area" style="--c:'+AREAS[A]+'"><div class="arow-w"><button class="arow'+(S.a.has(A)?' on':'')+'" data-a="'+esc(A)+'"><i class="dot"></i>'+(AREA_SHORT[A]||A)+'<span class="n">'+(ca[A]||0)+'</span></button><button class="chev'+(open.has(A)?' open':'')+'" data-o="'+esc(A)+'" aria-label="Show topics">›</button></div>';
  if(open.has(A))h+='<div class="trows">'+codes.map(c=>'<button class="trow'+(S.t.has(c)?' on':'')+((ct[c]||0)===0&&!S.t.has(c)?' z':'')+'" data-t="'+c+'"><b>'+c+'</b>'+T[c][0]+'<span class="n">'+(ct[c]||0)+'</span></button>').join('')+'</div>';
  h+='</div>'}
 h+='</div><div class="grp"><h3>Show</h3><div class="chips"><button class="chip'+(S.saved?' on':'')+'" data-f="saved">★ Saved<small>'+Object.keys(ST).length+'</small></button><button class="chip'+(S.ver?' on':'')+'" data-f="ver">Verified topics only</button></div></div>';
 $('#side').innerHTML=h}
function pills(){
 const P=[];
 S.p.forEach(v=>P.push(['p',v,'Paper '+v]));S.y.forEach(v=>P.push(['y',v,v]));S.s.forEach(v=>P.push(['s',v,v]));
 if(mode!=='papers'){S.m.forEach(v=>P.push(['m',v,MB[v][0]+' marks']));
 S.a.forEach(v=>P.push(['a',v,AREA_SHORT[v]||v]));S.t.forEach(v=>P.push(['t',v,T[v][0]]));
 if(S.saved)P.push(['f','saved','Saved']);if(S.ver)P.push(['f','ver','Verified topics'])}
 if(S.txt)P.push(['x','','“'+esc(S.txt)+'”']);
 const pillsHtml=P.map(p=>'<span class="pill">'+p[2]+'<i role="button" tabindex="0" data-pg="'+p[0]+'" data-pv="'+p[1]+'" aria-label="Remove">✕</i></span>').join('');
 const total=mode==='papers'?PAPERS.length:Q.length,n=mode==='papers'?PR.length:R.length,noun=mode==='papers'?'paper':'question';
 $('#meta').innerHTML='<span class="count">'+n+' of '+total+' '+(total===1?noun:noun+'s')+'</span>'+(P.length?'<span class="pillwrap"><span class="pills" id="pills">'+pillsHtml+'<button type="button" class="pill more" id="pmore" hidden aria-expanded="false"></button></span><div class="pmenu" id="pmenu" hidden></div></span><button class="clear" id="clr">Clear all</button>':'');
 $('#fbadge').textContent=P.length||'';
 fitPills()}
function fitPills(){
 const row=$('#pills'),more=$('#pmore'),menu=$('#pmenu');
 if(!row||!more||!menu)return;
 [...menu.querySelectorAll('.pill')].forEach(el=>row.insertBefore(el,more));
 more.hidden=true;menu.hidden=true;more.setAttribute('aria-expanded','false');
 if(row.clientWidth<8)return;
 const items=()=>[...row.querySelectorAll('.pill:not(.more)')];
 const over=()=>row.scrollWidth>row.clientWidth+1;
 if(!over())return;
 let n=0;
 while(over()){
  const list=items();
  if(!list.length)break;
  menu.insertBefore(list[list.length-1],menu.firstChild);
  n++;more.hidden=false;more.textContent='+'+n;more.setAttribute('aria-label',n+' more filters')}}
function filtersFrom(search){
 const u=new URLSearchParams(search),F={p:new Set(),y:new Set(),s:new Set(),m:new Set(),a:new Set(),t:new Set(),saved:false,ver:false,q:'',sort:'new'};
 for(const k of ['p','y','s','m','a','t'])for(const x of (u.get(k)||'').split(',')){
  if(!x)continue;
  if(k==='p'||k==='y'||k==='m'){const n=+x;if(Number.isFinite(n))F[k].add(n)}
  else F[k].add(x)}
 F.saved=u.get('saved')==='1';F.ver=u.get('ver')==='1';F.q=u.get('q')||'';
 const sort=u.get('sort');if(['old','mh','ml','tp'].includes(sort))F.sort=sort;
 F.browse=u.get('browse')==='papers'?'papers':'questions';
 return F}
function filtersTo(S,q,sort,path){
 const u=new URLSearchParams();
 for(const k of ['p','y','s','m','a','t'])if(S[k].size)u.set(k,[...S[k]].join(','));
 if(S.saved)u.set('saved','1');if(S.ver)u.set('ver','1');
 if(q)u.set('q',q);if(sort&&sort!=='new')u.set('sort',sort);
 if(S.browse==='papers')u.set('browse','papers');
 const s=u.toString();return s?path+'?'+s:path}
function loadFilters(){
 const F=filtersFrom(location.search);
 for(const k of ['p','y','s','m','a','t'])F[k].forEach(v=>S[k].add(v));
 S.saved=F.saved;S.ver=F.ver;S.txt=F.q.trim().toLowerCase();mode=F.browse;
 if(mode==='papers'&&!['new','old'].includes(F.sort))F.sort='new';
 $('#q').value=F.q;$('#sort').value=F.sort;
 F.a.forEach(A=>open.add(A));F.t.forEach(c=>{if(T[c])open.add(T[c][1])})}
function syncUrl(){S.browse=mode;history.replaceState(null,'',filtersTo(S,$('#q').value.trim(),$('#sort').value,location.pathname))}
function syncSort(){
 const el=$('#sort');
 const html=mode==='papers'
  ?'<option value="new">Year, newest</option><option value="old">Year, oldest</option>'
  :'<option value="new">Newest first</option><option value="old">Oldest first</option><option value="mh">Most marks</option><option value="ml">Fewest marks</option><option value="tp">By topic</option>';
 if(el.dataset.mode===mode)return;
 const v=el.value;el.innerHTML=html;el.dataset.mode=mode;el.value=html.includes('value="'+v+'"')?v:'new'}
function render(){
 syncSort();
 if(mode==='papers')PR=PAPERS.filter(p=>okPaper(p)),sortP();
 else R=Q.filter(q=>ok(q)),sortR(),shown=30;
 side();pills();$('#main').scrollTop=0;draw();syncUrl();
 $('#q').placeholder=mode==='papers'?'Search year, session, time zone':'Search questions, topics, papers'}
function draw(){
 const g=$('#grid');
 if(mode==='papers'){
  g.classList.add('list');
  if(!PR.length){g.innerHTML='<div class="empty"><b>No papers match</b>Try another year or session.<br><button id="clr2">Clear filters</button></div>';return}
  g.innerHTML=PR.map((p,i)=>'<button type="button" class="prow" data-i="'+i+'"><span class="qn">Paper '+p.p+(p.z?' '+esc(p.z):'')+'</span><span class="src">'+esc(p.s+' '+p.y)+'</span><span class="mk">'+p.n+' questions</span></button>').join('');
  return}
 g.classList.remove('list');
 if(!R.length){g.innerHTML='<div class="empty"><b>No questions match</b>Try removing a filter or searching for something broader.<br><button id="clr2">Clear filters</button></div>';return}
 g.innerHTML=R.slice(0,shown).map(card).join('');typeset([...g.querySelectorAll('.prev')])}
function more(){if(mode==='papers'||shown>=R.length)return;const s=shown;shown+=30;const g=$('#grid'),t=document.createElement('div');t.innerHTML=R.slice(s,shown).map((q,i)=>card(q,s+i)).join('');const els=[...t.children];els.forEach(e=>g.appendChild(e));typeset(els.map(e=>e.querySelector('.prev')))}
new IntersectionObserver(e=>{if(e[0].isIntersecting)more()},{rootMargin:'600px'}).observe($('#sent'));
function clearAll(){['p','y','s','m','a','t'].forEach(k=>S[k].clear());S.saved=S.ver=false;S.txt='';$('#q').value='';render()}
function tog(set,v){set.has(v)?set.delete(v):set.add(v)}
document.addEventListener('click',e=>{
 const t=e.target;let b;
 const menu=$('#pmenu');
 if(menu&&!menu.hidden&&!t.closest('#pmenu')&&!t.closest('#pmore')){menu.hidden=true;const more=$('#pmore');if(more)more.setAttribute('aria-expanded','false')}
 if(b=t.closest('#pmore')){const m=$('#pmenu');if(m){m.hidden=!m.hidden;b.setAttribute('aria-expanded',m.hidden?'false':'true')}return}
 if(b=t.closest('.star')){e.stopPropagation();const q=R[+b.dataset.s];ST[q.i]?delete ST[q.i]:ST[q.i]=1;saveST();b.classList.toggle('on');b.textContent=ST[q.i]?'★':'☆';if(S.saved)render();else side();return}
 if(b=t.closest('.prow')){showPaper(+b.dataset.i);return}
 if(b=t.closest('.card')){show(+b.dataset.i);return}
 if(b=t.closest('[data-pg]')){const g=b.dataset.pg,v=b.dataset.pv;if(g==='f')S[v]=false;else if(g==='x'){S.txt='';$('#q').value=''}else tog(S[g],g==='p'||g==='y'||g==='m'?+v:v);render();return}
 if(t.closest('#clr')||t.closest('#clr2')){clearAll();return}
 if(b=t.closest('[data-o]')){tog(open,b.dataset.o);side();return}
 if(b=t.closest('[data-a]')){tog(S.a,b.dataset.a);if(S.a.has(b.dataset.a))open.add(b.dataset.a);render();return}
 if(b=t.closest('[data-t]')){tog(S.t,b.dataset.t);render();return}
 if(b=t.closest('[data-f]')){S[b.dataset.f]=!S[b.dataset.f];render();return}
 if(b=t.closest('[data-g]')){const g=b.dataset.g;tog(S[g],g==='s'?b.dataset.v:+b.dataset.v);render();return}
 if(t.closest('#fopen')){$('#side').classList.add('on');$('#scrim').classList.add('on');return}
 if(t.closest('#close')||t===$('#scrim')){shut();return}
 if(t.closest('#prev'))docs?showPaper(cur-1):show(cur-1);if(t.closest('#next'))docs?showPaper(cur+1):show(cur+1);
 if(t.closest('#bm')&&cur>=0){const q=R[cur];ST[q.i]?delete ST[q.i]:ST[q.i]=1;saveST();sheetStar();draw2();side()}
 if(t.closest('#cp')){if(cur<0)return;const b=$('#cp');navigator.clipboard&&navigator.clipboard.writeText(R[cur].t).then(()=>{b.classList.add('done');clearTimeout(b._t);b._t=setTimeout(()=>b.classList.remove('done'),900)}).catch(()=>{})}
 if(t.closest('#tText')){view='text';applyView();return}
 if(t.closest('#tPaper')){view='paper';applyView();return}
 if(t.closest('#tScheme')&&!t.closest('#tScheme').disabled){view='scheme';applyView();return}
});
function draw2(){const y=$('#main').scrollTop;draw();$('#main').scrollTop=y}
let tm;$('#q').addEventListener('input',e=>{clearTimeout(tm);tm=setTimeout(()=>{S.txt=e.target.value.trim().toLowerCase();render()},140)});
$('#sort').addEventListener('change',()=>{if(mode==='papers'){sortP();draw();syncUrl();return}sortR();shown=30;draw();syncUrl()});
document.addEventListener('change',e=>{if(e.target.id!=='browse')return;mode=e.target.value;if($('#sheet').classList.contains('on'))shut();render()});
document.addEventListener('keydown',e=>{
 const typing=/INPUT|SELECT/.test(document.activeElement.tagName);
 if(e.key==='Escape'){const menu=$('#pmenu');if(menu&&!menu.hidden){menu.hidden=true;$('#pmore').setAttribute('aria-expanded','false');return}if($('#sheet').classList.contains('on'))shut();else if(typing)document.activeElement.blur();else $('#side').classList.remove('on'),$('#scrim').classList.remove('on')}
 else if(e.key==='/'&&!typing){e.preventDefault();$('#q').focus()}
 else if(!typing&&$('#sheet').classList.contains('on')){if(e.key==='ArrowRight')docs?showPaper(cur+1):show(cur+1);if(e.key==='ArrowLeft')docs?showPaper(cur-1):show(cur-1);if(!docs&&(e.key==='s'||e.key==='b')){$('#bm').click()}}
 else if(e.key==='Enter'&&document.activeElement.classList.contains('card'))show(+document.activeElement.dataset.i)});
function sheetStar(){const on=!!ST[R[cur].i];const b=$('#bm');b.classList.toggle('on',on);b.setAttribute('aria-pressed',on?'true':'false')}
function bodyHTML(i){
 const q=R[i];
 const scheme=q.e?'<div class="scheme qwrap"><div class="q">'+fmt(q.e)+'</div></div>':'<div class="scheme paper"><img alt="Markscheme for this question"></div>';
 return '<div class="facts">'+(q.m?'<span><b>'+q.m+'</b> marks</span>':'')+'<span>'+calc(q)+'</span><span>Pages '+q.a+(q.b!==q.a?'–'+q.b:'')+'</span><span>'+(i+1)+' of '+R.length+' in current view</span></div><div class="tags" style="margin-bottom:22px">'+tags(q,9)+'</div><div class="paper"><img alt="Question as printed on the paper"></div>'+scheme+'<div class="qwrap"><div class="q">'+fmt(q.t)+'</div>'+(q.v?'':'<div class="note">Topic tags for this question were assigned automatically and may not be exact.</div>')+'</div>'}
function loadCut(box,i,kind){
 const img=box.querySelector('img');
 if(!img)return;
 const src='/'+kind+'/'+encodeURIComponent(R[i].i)+'.png';
 img.onerror=()=>{box.innerHTML='<p class="note">'+(kind==='scheme'?'No markscheme for this question.':'No printed cutout for this question.')+'</p>'};
 if(img.getAttribute('src')!==src)img.src=src}
function prep(pane,i){
 const box=pane.querySelector('.paper:not(.scheme)'),scheme=pane.querySelector('.scheme'),wrap=pane.querySelector('.qwrap:not(.scheme)');
 if(!box||!wrap)return;
 box.hidden=view!=='paper';scheme.hidden=view!=='scheme';wrap.hidden=view!=='text';
 if(view==='paper')loadCut(box,i,'cut');
 if(view==='scheme'&&!R[i].e)loadCut(scheme,i,'scheme');
 typeset([...pane.querySelectorAll('.q')])}
function showPaper(i){
 if(i<0||i>=PR.length)return;
 docs=true;cur=i;
 const p=PR[i];
 $('#sbody').innerHTML='<iframe class="pframe" src="/pdf?paper='+encodeURIComponent(p.i)+'" title="'+esc(paperName(p))+'"></iframe>';
 $('#count').textContent=paperName(p);
 $('#prev').disabled=i===0;$('#next').disabled=i===PR.length-1;
 $('#sheet').classList.add('on','docs');$('#scrim').classList.add('on');
 $('#sheet').setAttribute('aria-hidden','false');$('#sheet').setAttribute('aria-label','Paper')}
function show(i){
 if(i<0||i>=R.length)return;if(i>=shown){shown=i+10;draw2()}
 docs=false;$('#sheet').classList.remove('docs');$('#sheet').setAttribute('aria-label','Question');
 cur=i;
 const body=$('#sbody');
 body.classList.remove('swiping');
 $('#count').textContent=(i+1)+' / '+R.length;
 $('#prev').disabled=i===0;$('#next').disabled=i===R.length-1;sheetStar();
 body.innerHTML=bodyHTML(i);
 body.scrollTop=0;$('#sheet').classList.add('on');$('#scrim').classList.add('on');$('#sheet').setAttribute('aria-hidden','false');
 applyView();typeset([...body.querySelectorAll('.q')])}
function applyView(){
 const q=R[cur];
 const schemeOn=!!(q&&q.k);
 if(view==='scheme'&&!schemeOn)view='text';
 $('#tText').classList.toggle('on',view==='text');
 $('#tPaper').classList.toggle('on',view==='paper');
 $('#tScheme').classList.toggle('on',view==='scheme');
 $('#tScheme').disabled=!schemeOn;
 const box=$('#sbody .paper:not(.scheme)'),scheme=$('#sbody .scheme'),wrap=$('#sbody .qwrap:not(.scheme)');
 if(!box||!wrap)return;
 box.hidden=view!=='paper';scheme.hidden=view!=='scheme';wrap.hidden=view!=='text';
 if(view==='paper')loadCut(box,cur,'cut');
 if(view==='scheme'&&!q.e)loadCut(scheme,cur,'scheme');}
function shut(){docs=false;$('#sheet').classList.remove('on','docs');$('#side').classList.remove('on');$('#scrim').classList.remove('on');$('#sheet').setAttribute('aria-hidden','true');$('#sheet').setAttribute('aria-label','Question')}
(function(){
 const sheet=$('#sheet'),body=$('#sbody');
 let on=false,busy=false,x0=0,y0=0,x=0,t0=0,vx=0,mode=0,w=0,base=0;
 const point=e=>e.changedTouches?e.changedTouches[0]:e.touches?e.touches[0]:e;
 function reel(){return body.querySelector('.reel')}
 function place(px){const r=reel();if(r)r.style.transform='translate3d('+px+'px,0,0)'}
 function arm(){
  if(reel())return;
  const top=body.scrollTop,pad=getComputedStyle(body).padding;
  body.classList.add('swiping');
  w=body.clientWidth;
  const strip=document.createElement('div');
  strip.className='reel';
  [-1,0,1].forEach(d=>{
   const pane=document.createElement('div');
   pane.className='pane';pane.style.width=w+'px';pane.style.padding=pad;
   const i=cur+d;
   if(i>=0&&i<R.length){
    if(d===0){while(body.firstChild)pane.appendChild(body.firstChild);pane.scrollTop=top}
    else{pane.innerHTML=bodyHTML(i);prep(pane,i)}
   }
   strip.appendChild(pane);
  });
  body.appendChild(strip);
  base=-w;place(base);
 }
 function lift(dest){
  const strip=reel();if(!strip)return;
  const pane=strip.children[dest-cur+1],top=pane?pane.scrollTop:0,nodes=pane?[...pane.childNodes]:[];
  body.classList.remove('swiping');strip.remove();
  nodes.forEach(n=>body.appendChild(n));
  body.scrollTop=top;
  if(dest===cur)return;
  if(dest>=shown){shown=dest+10;draw2()}
  cur=dest;
  $('#count').textContent=(cur+1)+' / '+R.length;
  $('#prev').disabled=cur===0;$('#next').disabled=cur===R.length-1;sheetStar();
  applyView();
 }
 function slide(dest){
  const strip=reel();if(!strip)return;
  busy=true;on=false;mode=0;
  const target=dest>cur?-2*w:dest<cur?0:-w;
  strip.style.transition='transform .34s cubic-bezier(.32,.72,0,1)';
  place(target);
  let done=false;
  const finish=()=>{if(done)return;done=true;busy=false;strip.style.transition='none';lift(dest)};
  strip.addEventListener('transitionend',finish,{once:true});
  setTimeout(finish,380);
 }
 function down(e){
  if(docs||busy||!sheet.classList.contains('on'))return;
  if(!e.touches||e.touches.length!==1)return;
  if(e.target.closest('.qfoot,button,a,input,select,textarea'))return;
  const p=point(e);
  on=true;mode=0;x0=x=p.clientX;y0=p.clientY;t0=e.timeStamp;vx=0;
 }
 function move(e){
  if(!on)return;
  const p=point(e),dx=p.clientX-x0,dy=p.clientY-y0;
  if(!mode){
   if(Math.abs(dx)<12&&Math.abs(dy)<12)return;
   mode=Math.abs(dx)>Math.abs(dy)?1:2;
   if(mode===2){on=false;return}
   arm();
  }
  if(mode!==1||!reel())return;
  if(e.cancelable)e.preventDefault();
  const dt=Math.max(1,e.timeStamp-t0);
  vx=(p.clientX-x)/dt;x=p.clientX;t0=e.timeStamp;
  let shift=base+dx,min=cur>=R.length-1?-w:-2*w,max=cur<=0?-w:0;
  if(shift>max)shift=max+(shift-max)*.28;
  if(shift<min)shift=min+(shift-min)*.28;
  reel().style.transition='none';place(shift);
 }
 function up(e){
  if(!on)return;
  const dx=point(e).clientX-x0;
  on=false;
  if(mode!==1||!reel()){mode=0;return}
  let dest=cur;
  if(Math.abs(dx)>56||Math.abs(vx)>.45){if(dx<0&&cur<R.length-1)dest=cur+1;else if(dx>0&&cur>0)dest=cur-1}
  mode=0;slide(dest);
 }
 function cancel(){if(busy)return;on=false;mode=0;if(reel())slide(cur)}
 sheet.addEventListener('touchstart',down,{passive:true});
 sheet.addEventListener('touchmove',move,{passive:false});
 sheet.addEventListener('touchend',up);
 sheet.addEventListener('touchcancel',cancel);
})();
loadFilters();render();
if(window.lucide)lucide.createIcons({attrs:{'stroke-width':1.75}});
new ResizeObserver(()=>fitPills()).observe($('#meta'));
if(document.fonts)document.fonts.ready.then(()=>fitPills());
</script>
</body>
</html>
